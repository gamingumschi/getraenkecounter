<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Getränkecounter</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #1C1B18;
    --panel: #26241f;
    --border: #3a372f;
    --chalk: #EDE6D6;
    --muted: #A69C8A;
    --dim: #6b6658;
    --amber: #C98A3E;
    --amber-dark: #b57933;
    --burgundy: #7B2D3E;
    --red: #c0392b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--chalk);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding: 32px 16px;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 400px; }

  .eyebrow {
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }
  h1 {
    text-align: center;
    font-family: Georgia, serif;
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 24px;
  }

  .hero {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 24px;
    margin-bottom: 24px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }
  .tally {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 12px;
    justify-content: center;
    min-height: 32px;
    margin-bottom: 24px;
  }
  .tally-group { position: relative; display: flex; align-items: flex-end; }
  .tally-mark {
    width: 3px; height: 24px;
    background: var(--chalk);
    border-radius: 2px;
    margin: 0 2px;
  }
  .tally-slash {
    position: absolute; width: 36px; height: 3px;
    background: var(--amber);
    border-radius: 2px;
    top: 40%; left: -2px;
    transform: rotate(-14deg);
  }
  .total { text-align: center; }
  .total-num {
    font-family: Georgia, serif;
    font-size: 48px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .total-label {
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 8px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }
  .drink-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    text-align: left;
    color: var(--chalk);
    font-family: inherit;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }
  .drink-btn:active { background: #2e2c25; transform: scale(0.97); }
  .drink-icon {
    width: 32px; height: 32px;
    border-radius: 999px;
    background: var(--border);
    display: flex; align-items: center; justify-content: center;
    color: var(--amber);
    font-size: 16px;
  }
  .drink-name { font-size: 14px; font-weight: 600; line-height: 1.2; }
  .drink-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .add-toggle {
    width: 100%;
    background: transparent;
    border: 1px dashed #4a4638;
    border-radius: 12px;
    padding: 12px;
    color: var(--muted);
    font-size: 14px;
    font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-bottom: 12px;
    cursor: pointer;
  }
  .add-toggle:active { background: var(--panel); }

  .add-form {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    display: none;
    flex-direction: column;
    gap: 12px;
  }
  .add-form.open { display: flex; }
  .add-form input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    color: var(--chalk);
    font-family: inherit;
    width: 100%;
  }
  .add-form input::placeholder { color: var(--dim); }
  .add-form input:focus { outline: none; border-color: var(--amber); }
  .row2 { display: flex; gap: 12px; }
  .row2 > div { flex: 1; }
  .field-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--muted); display: block; margin-bottom: 4px;
  }
  .preview { font-size: 11px; color: var(--muted); }
  .submit-btn {
    background: var(--amber);
    color: var(--bg);
    font-weight: 600;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    margin-top: 4px;
  }
  .submit-btn:active { background: var(--amber-dark); }

  .history-toggle {
    width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    background: none; border: none;
    border-top: 1px solid var(--border);
    padding: 12px 0;
    color: var(--muted);
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    margin-top: 8px;
  }
  .chevron { transition: transform 0.2s; }
  .chevron.open { transform: rotate(180deg); }

  .history { display: none; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .history.open { display: flex; }
  .history-empty { text-align: center; font-size: 14px; color: var(--dim); padding: 24px 0; }
  .history-item {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .history-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .history-icon {
    width: 28px; height: 28px; border-radius: 999px;
    background: var(--border);
    display: flex; align-items: center; justify-content: center;
    color: var(--amber); font-size: 13px; flex-shrink: 0;
  }
  .history-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .history-sub { font-size: 11px; color: var(--muted); }
  .history-del {
    background: none; border: none; color: var(--dim);
    padding: 4px; cursor: pointer; flex-shrink: 0; font-size: 16px;
  }
  .history-del:active { color: var(--red); }

  .reset-btn {
    width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    border-radius: 12px;
    padding: 12px;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    margin-top: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .reset-btn:active { background: var(--panel); }
  .reset-btn.confirm { background: var(--burgundy); border-color: var(--burgundy); color: var(--chalk); }

  .footnote { text-align: center; font-size: 10px; color: var(--dim); margin-top: 24px; letter-spacing: 0.02em; }

  .session-bar { text-align: center; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; font-variant-numeric: tabular-nums; }
  .session-bar.live { color: var(--amber); }
  .session-btn {
    width: 100%; border: none; border-radius: 12px; padding: 16px;
    font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer;
    background: var(--amber); color: var(--bg); margin-bottom: 20px;
  }
  .session-btn:active { background: var(--amber-dark); }
  .session-btn.stop { background: transparent; color: var(--chalk); border: 1px solid var(--burgundy); }
  .session-btn.stop:active { background: var(--panel); }
  .session-btn.stop.confirm { background: var(--burgundy); color: var(--chalk); }
  .drink-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .drink-btn:disabled:active { transform: none; background: var(--panel); }
  .hint { text-align: center; font-size: 12px; color: var(--dim); margin: -8px 0 16px; }
  .session-item { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 0; }
  .session-item summary { list-style: none; cursor: pointer; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .session-item summary::-webkit-details-marker { display: none; }
  .session-title { font-size: 14px; font-weight: 500; }
  .session-sub { font-size: 11px; color: var(--muted); }
  .session-sg { font-family: Georgia, serif; font-size: 20px; font-weight: 700; white-space: nowrap; }
  .session-body { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--border); padding-top: 10px; }
  .session-line { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .session-del { align-self: flex-end; background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 6px 10px; font-size: 12px; font-family: inherit; cursor: pointer; margin-top: 4px; }
  .session-del:active { color: var(--red); }


  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--chalk); color: var(--bg);
    font-size: 14px; font-weight: 500;
    padding: 10px 18px; border-radius: 999px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
    z-index: 100;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Strichliste</div>
  <h1>Getränkecounter</h1>

  <div class="session-bar" id="sessionBar">Keine aktive Session</div>
  <button class="session-btn" id="sessionBtn">▶ Session starten</button>

  <div class="hero">
    <div class="tally" id="tally"></div>
    <div class="total">
      <div class="total-num" id="totalNum">0</div>
      <div class="total-label">Standardgläser</div>
    </div>
  </div>

  <div class="hint" id="hint">Starte eine Session, um Getränke einzutragen.</div>
  <div class="grid" id="predefinedGrid"></div>

  <button class="add-toggle" id="addToggle">+ Eigenes Getränk hinzufügen</button>

  <form class="add-form" id="addForm">
    <input type="text" id="customName" placeholder="Name (z. B. Aperol Spritz)" required>
    <div class="row2">
      <div>
        <label class="field-label">Menge (ml)</label>
        <input type="text" inputmode="decimal" id="customMl" placeholder="200" required>
      </div>
      <div>
        <label class="field-label">Vol %</label>
        <input type="text" inputmode="decimal" id="customVol" placeholder="11" required>
      </div>
    </div>
    <div class="preview" id="customPreview"></div>
    <button type="submit" class="submit-btn">Hinzufügen</button>
  </form>

  <button class="history-toggle" id="historyToggle">
    <span id="historyCount">Verlauf (0)</span>
    <span class="chevron" id="historyChevron">▾</span>
  </button>
  <div class="history" id="history"></div>

  <button class="history-toggle" id="sessionsToggle">
    <span id="sessionsCount">Frühere Sessions (0)</span>
    <span class="chevron" id="sessionsChevron">▾</span>
  </button>
  <div class="history" id="sessions"></div>

  <button class="reset-btn" id="resetBtn">🗑 Alle Sessions löschen</button>

  <div class="footnote">Formel: ml × (Vol% / 100) × 0,8 / 10g</div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = "getraenkecounter-sessions";
const OLD_KEY = "getraenkecounter-entries";

const PREDEFINED = [
  { id: "bier500", name: "Bier 0,5l", ml: 500, vol: 5, icon: "🍺" },
  { id: "bier330", name: "Bier 0,33l", ml: 330, vol: 5, icon: "🍺" },
  { id: "wein125", name: "Wein", ml: 125, vol: 12, icon: "🍷" },
  { id: "spritzer250", name: "Weinspritzer", ml: 250, vol: 6, icon: "🥂" },
  { id: "alkoholfrei500", name: "Alkoholfrei 0,5l", ml: 500, vol: 0, icon: "💧" },
];

function toStandardglas(ml, vol) {
  return (ml * (vol / 100) * 0.8) / 10;
}
function fmt(n) {
  return n.toLocaleString("de-AT", { maximumFractionDigits: 2 });
}
function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
function fmtDuration(ms) {
  const totalMin = Math.max(0, Math.floor(ms / 60000));
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  return h + ":" + String(m).padStart(2, "0") + " h";
}
function fmtDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString("de-AT", { weekday: "short", day: "2-digit", month: "2-digit" }) +
         ", " + d.toLocaleTimeString("de-AT", { hour: "2-digit", minute: "2-digit" });
}
function sessionTotal(sess) {
  return sess.entries.reduce((sum, e) => sum + e.sg, 0);
}

// ---------- State ----------
let sessions = []; // newest first; active session = one without "end"

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { sessions = JSON.parse(raw); return; }
  } catch (e) {}
  // Migration: Einträge aus der alten Version als eigene Session übernehmen
  try {
    const old = JSON.parse(localStorage.getItem(OLD_KEY) || "[]");
    if (Array.isArray(old) && old.length > 0) {
      const times = old.map(e => e.ts || Date.now());
      sessions = [{
        id: "old-" + Date.now(),
        start: Math.min(...times),
        end: Math.max(...times),
        entries: old,
      }];
      save();
    }
  } catch (e) { sessions = []; }
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions)); } catch (e) {}
}
function activeSession() {
  return sessions.find(s => !s.end) || null;
}

load();

let historyOpen = false;
let sessionsOpen = false;
let confirmStop = false, stopTimer = null;
let confirmReset = false, resetTimer = null;
let toastTimer = null;

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

// ---------- Session-Steuerung ----------
function startSession() {
  if (activeSession()) return;
  sessions.unshift({ id: "s-" + Date.now(), start: Date.now(), end: null, entries: [] });
  save();
  render();
  showToast("Session gestartet");
}
function stopSession() {
  const s = activeSession();
  if (!s) return;
  s.end = Date.now();
  save();
  render();
  showToast("Session beendet");
}

document.getElementById("sessionBtn").addEventListener("click", () => {
  const btn = document.getElementById("sessionBtn");
  if (!activeSession()) { startSession(); return; }
  if (!confirmStop) {
    confirmStop = true;
    btn.classList.add("confirm");
    btn.textContent = "Wirklich beenden? Nochmal tippen";
    stopTimer = setTimeout(() => { confirmStop = false; render(); }, 3000);
    return;
  }
  clearTimeout(stopTimer);
  confirmStop = false;
  stopSession();
});

// ---------- Einträge ----------
function addEntry(name, ml, vol, icon) {
  const s = activeSession();
  if (!s) { showToast("Starte zuerst eine Session"); return false; }
  s.entries.unshift({
    id: Date.now() + "-" + Math.random().toString(36).slice(2, 7),
    name, ml, vol, icon: icon || "🍹", sg: toStandardglas(ml, vol), ts: Date.now(),
  });
  save();
  render();
  showToast(name + " hinzugefügt");
  return true;
}
function removeEntry(id) {
  const s = activeSession();
  if (!s) return;
  s.entries = s.entries.filter(e => e.id !== id);
  save();
  render();
}
function removeSession(id) {
  sessions = sessions.filter(s => s.id !== id);
  save();
  render();
}

// ---------- Rendering ----------
function renderTally(count) {
  const el = document.getElementById("tally");
  el.innerHTML = "";
  const fullGroups = Math.floor(count / 5);
  const rest = count % 5;
  const groups = Array(fullGroups).fill(5).concat(rest > 0 ? [rest] : []);
  if (groups.length === 0) groups.push(0);

  groups.forEach(g => {
    const group = document.createElement("div");
    group.className = "tally-group";
    group.style.minWidth = (g === 5 ? 34 : g * 7) + "px";
    for (let i = 0; i < g; i++) {
      const mark = document.createElement("div");
      mark.className = "tally-mark";
      mark.style.transform = "rotate(" + ((i - 2) * 3) + "deg)";
      group.appendChild(mark);
    }
    if (g === 5) {
      const slash = document.createElement("div");
      slash.className = "tally-slash";
      group.appendChild(slash);
    }
    el.appendChild(group);
  });
}

function updateElapsed() {
  const s = activeSession();
  const bar = document.getElementById("sessionBar");
  if (s) {
    bar.textContent = "Session läuft · " + fmtDuration(Date.now() - s.start);
    bar.classList.add("live");
  } else {
    bar.textContent = "Keine aktive Session";
    bar.classList.remove("live");
  }
}

function render() {
  const active = activeSession();
  const entries = active ? active.entries : [];

  // Hero
  const total = entries.reduce((sum, e) => sum + e.sg, 0);
  document.getElementById("totalNum").textContent = fmt(Math.round(total * 10) / 10);
  renderTally(Math.round(total));
  updateElapsed();

  // Start/Stop-Button
  const btn = document.getElementById("sessionBtn");
  if (active) {
    btn.className = "session-btn stop" + (confirmStop ? " confirm" : "");
    btn.textContent = confirmStop ? "Wirklich beenden? Nochmal tippen" : "■ Session beenden";
  } else {
    btn.className = "session-btn";
    btn.textContent = "▶ Session starten";
  }

  // Getränke-Buttons nur bei aktiver Session
  document.querySelectorAll(".drink-btn").forEach(b => { b.disabled = !active; });
  document.getElementById("hint").style.display = active ? "none" : "block";

  // Verlauf der aktuellen Session
  document.getElementById("historyCount").textContent = "Verlauf (" + entries.length + ")";
  const hist = document.getElementById("history");
  hist.innerHTML = "";
  if (entries.length === 0) {
    hist.innerHTML = '<div class="history-empty">Noch nichts eingetragen.</div>';
  } else {
    entries.forEach(e => {
      const item = document.createElement("div");
      item.className = "history-item";
      item.innerHTML = `
        <div class="history-left">
          <div class="history-icon">${e.icon}</div>
          <div>
            <div class="history-name">${escapeHtml(e.name)}</div>
            <div class="history-sub">${e.ml}ml · ${e.vol}% · ${fmt(e.sg)} SG</div>
          </div>
        </div>
        <button class="history-del" data-id="${e.id}">✕</button>
      `;
      hist.appendChild(item);
    });
    hist.querySelectorAll(".history-del").forEach(b => {
      b.addEventListener("click", () => removeEntry(b.dataset.id));
    });
  }

  // Frühere Sessions
  const past = sessions.filter(s => s.end);
  document.getElementById("sessionsCount").textContent = "Frühere Sessions (" + past.length + ")";
  const list = document.getElementById("sessions");
  list.innerHTML = "";
  if (past.length === 0) {
    list.innerHTML = '<div class="history-empty">Noch keine beendete Session.</div>';
  } else {
    past.forEach(sess => {
      const det = document.createElement("details");
      det.className = "session-item";
      const lines = sess.entries.length === 0
        ? '<div class="session-line">Keine Getränke eingetragen</div>'
        : sess.entries.slice().reverse().map(e =>
            `<div class="session-line"><span>${e.icon} ${escapeHtml(e.name)}</span><span>${fmt(e.sg)} SG</span></div>`
          ).join("");
      det.innerHTML = `
        <summary>
          <div>
            <div class="session-title">${fmtDate(sess.start)}</div>
            <div class="session-sub">${fmtDuration(sess.end - sess.start)} · ${sess.entries.length} Getränke</div>
          </div>
          <div class="session-sg">${fmt(Math.round(sessionTotal(sess) * 10) / 10)} <span class="session-sub">SG</span></div>
        </summary>
        <div class="session-body">
          ${lines}
          <button class="session-del" data-id="${sess.id}">Session löschen</button>
        </div>
      `;
      list.appendChild(det);
    });
    list.querySelectorAll(".session-del").forEach(b => {
      b.addEventListener("click", () => removeSession(b.dataset.id));
    });
  }
}

// ---------- Vordefinierte Getränke ----------
const grid = document.getElementById("predefinedGrid");
PREDEFINED.forEach(d => {
  const btn = document.createElement("button");
  btn.className = "drink-btn";
  btn.innerHTML = `
    <div class="drink-icon">${d.icon}</div>
    <div>
      <div class="drink-name">${d.name}</div>
      <div class="drink-sub">${d.vol}% · ${fmt(toStandardglas(d.ml, d.vol))} SG</div>
    </div>
  `;
  btn.addEventListener("click", () => addEntry(d.name, d.ml, d.vol, d.icon));
  grid.appendChild(btn);
});

// ---------- Eigenes Getränk ----------
document.getElementById("addToggle").addEventListener("click", () => {
  document.getElementById("addForm").classList.toggle("open");
});

function updatePreview() {
  const ml = parseFloat(document.getElementById("customMl").value.replace(",", "."));
  const vol = parseFloat(document.getElementById("customVol").value.replace(",", "."));
  const preview = document.getElementById("customPreview");
  if (ml > 0 && vol >= 0 && !isNaN(ml) && !isNaN(vol)) {
    preview.textContent = "≈ " + fmt(toStandardglas(ml, vol)) + " Standardgläser";
  } else {
    preview.textContent = "";
  }
}
document.getElementById("customMl").addEventListener("input", updatePreview);
document.getElementById("customVol").addEventListener("input", updatePreview);

document.getElementById("addForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const name = document.getElementById("customName").value.trim();
  const ml = parseFloat(document.getElementById("customMl").value.replace(",", "."));
  const vol = parseFloat(document.getElementById("customVol").value.replace(",", "."));
  if (!name || !ml || ml <= 0 || isNaN(vol) || vol < 0) return;
  if (!addEntry(name, ml, vol, "🍹")) return;
  document.getElementById("customName").value = "";
  document.getElementById("customMl").value = "";
  document.getElementById("customVol").value = "";
  document.getElementById("customPreview").textContent = "";
  document.getElementById("addForm").classList.remove("open");
});

// ---------- Auf-/Zuklappen ----------
document.getElementById("historyToggle").addEventListener("click", () => {
  historyOpen = !historyOpen;
  document.getElementById("history").classList.toggle("open", historyOpen);
  document.getElementById("historyChevron").classList.toggle("open", historyOpen);
});
document.getElementById("sessionsToggle").addEventListener("click", () => {
  sessionsOpen = !sessionsOpen;
  document.getElementById("sessions").classList.toggle("open", sessionsOpen);
  document.getElementById("sessionsChevron").classList.toggle("open", sessionsOpen);
});

// ---------- Alles löschen ----------
document.getElementById("resetBtn").addEventListener("click", () => {
  const btn = document.getElementById("resetBtn");
  if (!confirmReset) {
    confirmReset = true;
    btn.classList.add("confirm");
    btn.textContent = "Wirklich ALLES löschen? Nochmal tippen";
    resetTimer = setTimeout(() => {
      confirmReset = false;
      btn.classList.remove("confirm");
      btn.textContent = "🗑 Alle Sessions löschen";
    }, 3000);
    return;
  }
  sessions = [];
  save();
  confirmReset = false;
  clearTimeout(resetTimer);
  btn.classList.remove("confirm");
  btn.textContent = "🗑 Alle Sessions löschen";
  render();
  showToast("Alles gelöscht");
});

render();
setInterval(updateElapsed, 30000);
</script>
</body>
</html>
